name: C++ format and static analysis
on: [push, pull_request, workflow_dispatch]
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned formatting and Clang 18 analysis tools
        run: |
          python -m pip install -r scripts/cpp-quality-requirements.txt
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tidy-18 libgl1-mesa-dev libxkbcommon-dev libegl1
      - name: Exercise read-only formatting and real analyzer failure gates
        run: python scripts/test-cpp-quality.py --tidy-tool clang-tidy-18
      - name: Check enrolled and changed C++ sources
        env:
          QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -o pipefail
          mkdir -p build-quality/cpp-quality
          if [ -n "$QUALITY_BASE" ] && [ "$QUALITY_BASE" != "0000000000000000000000000000000000000000" ]; then
            python scripts/check-cpp-quality.py format --base "$QUALITY_BASE" | tee build-quality/cpp-quality/format.json
          else
            python scripts/check-cpp-quality.py format | tee build-quality/cpp-quality/format.json
          fi
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: linux_gcc_64
          cache: true
      - name: Configure actual Qt compilation database
        run: cmake -S . -B build-quality -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Analyze every production C++ translation unit
        run: python scripts/check-cpp-quality.py tidy --jobs 2
      - name: Preserve source lists and raw diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-quality-Linux
          path: |
            build-quality/cpp-quality/
            build-quality/compile_commands.json
            build-quality/CMakeCache.txt
          if-no-files-found: warn
