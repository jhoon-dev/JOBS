name: Desktop build and file lifecycle
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: win64_msvc2022_64
          - os: macos-15
            arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Qt 6.8 compatible macOS SDK
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.arch }}
          cache: true
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exported XLSX and PDF with independent readers
        run: |
          python -m pip install openpyxl==3.1.5 pypdf==6.10.0
          python scripts/verify-report-fixtures.py build
