name: Desktop build and file lifecycle
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: win64_msvc2022_64
          - os: macos-15
            arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Qt 6.8 compatible macOS SDK
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.arch }}
          cache: true
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      # Bound compiler memory for the Qt translation units on hosted runners.
      - run: cmake --build build --config Release --parallel 3
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Capture task and Gantt workspace presentation
        run: python scripts/capture-workspace-ui.py build
      - name: Preserve task and Gantt workspace screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-presentation-${{ runner.os }}
          path: build/workspace-ui/
          if-no-files-found: error
      - name: Exercise native multi-project windows and shared resource load
        run: python scripts/check-workspace-native.py build
      - name: Preserve workspace screen and acceptance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ runner.os }}
          path: |
            build/workspace-ui.png
            build/workspace-native.log
          if-no-files-found: warn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exported XLSX and PDF with independent readers
        run: |
          python -m pip install openpyxl==3.1.5 pypdf==6.10.0
          python scripts/verify-report-fixtures.py build
          python scripts/verify-project-xml.py build
      - name: Measure deterministic 1k and 10k schedules and UI
        run: python scripts/run-performance-probes.py --repeats 3
      - name: Measure cell edits and retained undo at 1k and 10k tasks
        run: python scripts/run-editing-performance-probes.py --repeats 7
      - name: Measure request worker and GUI commit phases
        run: python scripts/run-responsive-performance-probes.py --repeats 3
      - name: Check out pre-optimization editing reference
        uses: actions/checkout@v4
        with:
          ref: ae8d9edaa360388012fdb98cd79b633192919971
          path: build/editing-reference-source
      - name: Build reference with the same Qt and compiler
        run: |
          cmake -E copy tests/BulkPerformanceProbe.cpp build/editing-reference-source/tests/BulkPerformanceProbe.cpp
          cmake -E copy tests/ProjectedViewPerformanceProbe.cpp build/editing-reference-source/tests/ProjectedViewPerformanceProbe.cpp
          cmake -S build/editing-reference-source -B build/editing-reference-build -DCMAKE_BUILD_TYPE=Release
          cmake --build build/editing-reference-build --config Release --target jobs_editing_performance_probe jobs_responsive_performance_probe jobs_bulk_performance_probe jobs_projected_view_probe --parallel 3
      - name: Measure reference and compare paired editing observations
        run: |
          python scripts/run-editing-performance-probes.py --build-dir build/editing-reference-build --output-dir build/performance/editing-reference --repeats 7 --allow-short-history
          python scripts/compare-editing-performance.py build/performance/editing-reference build/performance/editing build/performance/editing-comparison.json
          python scripts/run-responsive-performance-probes.py --build-dir build/editing-reference-build --output-dir build/performance/responsive-reference --repeats 3
          python scripts/compare-responsive-performance.py build/performance/responsive-reference build/performance/responsive build/performance/responsive-comparison.json
      - name: Measure paired bulk UI operations
        run: |
          python scripts/run-bulk-performance-probes.py --build-dir build/editing-reference-build --output-dir build/performance/bulk-reference
          python scripts/run-bulk-performance-probes.py --reference build/performance/bulk-reference
      - name: Measure paired filtered sorted and WBS view operations
        run: |
          python scripts/run-projected-view-probes.py --build-dir build/editing-reference-build --output-dir build/performance/projected-views-reference
          python scripts/run-projected-view-probes.py --reference build/performance/projected-views-reference
      - name: Exercise native projected views and publication races
        run: python scripts/check-projected-views-native.py build
      - name: Preserve projected view evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projected-views-${{ runner.os }}
          path: build/projected-views-native.png
          if-no-files-found: warn
      - name: Exercise native structural editing and row notifications
        run: python scripts/check-bulk-native-ui.py build
      - name: Preserve native structural editing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-editing-${{ runner.os }}
          path: build/bulk-editing-native.png
          if-no-files-found: warn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify XER with independent TSV and MPXJ readers
        run: |
          python -m pip install mpxj==16.10.0 JPype1==1.6.0
          python scripts/verify-primavera-xer.py build
      - name: Capture native task editing screen
        run: python scripts/capture-task-editing-ui.py build
      - name: Exercise native model and cancellable editing
        run: python scripts/capture-model-async-ui.py build
      - name: Exercise native incremental refresh and WBS fallbacks
        run: python scripts/check-responsive-native-ui.py build
      - name: Preserve model and async editing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-async-editing-${{ runner.os }}
          path: |
            build/async-editing-ui.png
            build/async-editing-ui.json
          if-no-files-found: warn
      - name: Exercise native Project XML dialogs
        run: python scripts/capture-project-xml-ui.py build
      - name: Exercise native Primavera XER dialogs
        run: python scripts/capture-primavera-xer-ui.py build
      - name: Preserve Primavera XER evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primavera-xer-${{ runner.os }}
          path: |
            build/primavera-export.xer
            build/primavera-24h.xer
            build/primavera-export.json
            build/primavera-xer-*-native.png
          if-no-files-found: warn
      - name: Preserve Project XML evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-xml-${{ runner.os }}
          path: |
            build/project-xml-export.xml
            build/project-xml-export.json
            build/project-xml-preview-native.png
            build/project-xml-import-native.png
            build/project-xml-export-native.png
          if-no-files-found: warn
      - name: Preserve native UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-editing-ui-${{ runner.os }}
          path: build/task-editing-native-smoke.png
          if-no-files-found: warn
      - name: Preserve performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ runner.os }}
          path: build/performance/
          if-no-files-found: warn
